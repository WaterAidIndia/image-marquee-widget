<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Marquee Widget</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .marquee-container {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .marquee {
            display: flex;
            animation: marquee 30s linear infinite;
        }

        .marquee:hover {
            animation-play-state: paused;
        }

        .image-container {
            position: relative;
            margin: 10px;
            transition: transform 0.3s ease, scale 0.3s ease;
        }

        .image-container:hover {
            transform: scale(1.2);
            z-index: 1;
        }

        .image-container img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }

        .image-container a {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
            display: none;
        }

        .image-container:hover a {
            display: block;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div class="marquee-container">
